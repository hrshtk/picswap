<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 180px;
            padding: 10px;
            font-family: sans-serif;
            text-align: center;
        }

        button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #startBtn {
            background-color: #4CAF50;
            color: white;
            border: none;
        }

        #stopBtn {
            background-color: #f44336;
            color: white;
            border: none;
        }
    </style>
</head>

<body>
    <h4>Image Swapper</h4>
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
    <script src="popup.js"></script>
</body>

</html>
